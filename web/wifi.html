<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WiFi · Photo Frame</title><link rel="stylesheet" href="/app.css"><script src="/app.js" defer></script></head>
<body data-page="wifi"><nav aria-label="Main"><a href="/">Gallery</a><a href="/wifi" aria-current="page">WiFi</a><a href="/mqtt">MQTT</a></nav><main class="settings"><h1>WiFi settings</h1>
<p>The frame uses its setup hotspot when it cannot join your saved network. Changes apply after restarting the frame.</p>
<form id="settings"><label for="ssid">Network name (SSID)</label><input id="ssid" name="ssid" maxlength="32" autocomplete="off">
<label for="hostname">Local hostname</label><input id="hostname" name="hostname" maxlength="63" value="photoframe" required pattern="[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?" autocapitalize="none" spellcheck="false"><p>Open <span id="local-address">http://photoframe.local</span> on your home network. Give each frame a different hostname.</p>
<label for="password">New password</label><input id="password" name="pass" type="password" maxlength="64" placeholder="Leave blank to keep saved password" autocomplete="new-password">
<label class="check"><input id="clear-password" name="clear_password" type="checkbox">Clear saved password (open network)</label><p id="password-state"></p>
<button type="submit">Save settings</button></form><p id="notice" role="status" aria-live="polite"></p></main></body></html>
